{% extends "base.html" %}

{% block media %}
    <style>
        #problem-clone-panel {
            position: relative;
            margin: 5em auto auto -10em;
            top: 40%;
            left: 50%;
        }
    </style>
{% endblock %}

{% block body %}
    <form id="problem-clone-panel" action="" method="post" class="form-area">
        {% csrf_token %}
        <div><label class="inline-header grayed">{{ _('The cloned problem will get a new id.') }}</label></div>
        <hr>
        <button style="float:right;" type="submit">{{ _('Clone!') }}</button>
    </form>
{% endblock %}
