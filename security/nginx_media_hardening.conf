# ==============================================================================
# Configuración Segura de Nginx para Hosting de Medios en DMOJ (PNG, JPG, PDF, ZIP)
# ==============================================================================
# Arquitectura: Dominio aislado de medios (Cookieless Media Domain)
# Ejemplo: media.dmoj.local o dmoj-media.org

server {
    listen 443 ssl http2;
    server_name media.dmoj.local;

    # Certificados SSL / TLS
    ssl_certificate /etc/ssl/certs/dmoj-media.crt;
    ssl_certificate_key /etc/ssl/private/dmoj-media.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Raíz de almacenamiento de archivos desinfectados (montaje con flags: noexec, nosuid, nodev)
    root /var/dmoj/problem_media;

    # Deshabilitar totalmente la ejecución de scripts CGI / PHP / Python
    location ~* \.(php|pl|py|sh|cgi|phtml)$ {
        deny all;
        return 404;
    }

    # Despacho interno mediante X-Accel-Redirect (autorizado previamente por Django)
    location /internal_media/ {
        internal;
        alias /var/dmoj/problem_media/;

        # 1. Impedir MIME-Sniffing categóricamente
        add_header X-Content-Type-Options "nosniff" always;

        # 2. Content Security Policy:
        # Aísla el contexto de ejecución y permite exclusivamente ser embebido desde el juez principal
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors https://dmoj.local; sandbox allow-scripts allow-same-origin;" always;

        # 3. Aislamiento Cross-Origin
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        # 4. Políticas de caché seguras
        add_header Cache-Control "private, max-age=86400, no-transform" always;

        # Despacho de imágenes inline para enunciados
        location ~* \.(png|jpg|jpeg)$ {
            types {
                image/png png;
                image/jpeg jpg jpeg;
            }
            default_type application/octet-stream;
            add_header Content-Disposition "inline" always;
        }

        # PDFs: despacho inline para visualización en <iframe> dentro del dominio aislado
        location ~* \.pdf$ {
            types {
                application/pdf pdf;
            }
            default_type application/pdf;
            add_header Content-Disposition "inline" always;
        }

        # ZIP: descarga obligatoria siempre
        location ~* \.zip$ {
            types {
                application/zip zip;
            }
            default_type application/zip;
            add_header Content-Disposition "attachment" always;
        }
    }

    # Bloquear acceso directo fuera del mecanismo de autorización de Django
    location / {
        return 403 "Acceso denegado. Los recursos deben solicitarse a través de la API/Juez.";
    }
}
